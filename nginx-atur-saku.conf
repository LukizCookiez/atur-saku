# AturSaku — reverse proxy statis untuk Cloudflare Tunnel.
# Di-serve nginx; Cloudflare Tunnel forward subdomain -> http://127.0.0.1:8890
server {
    listen 127.0.0.1:8890;
    server_name _;

    root /var/www/atur-saku;
    index index.html;

    # SPA / file statis
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache asset
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    access_log /var/log/nginx/atur-saku.access.log;
    error_log  /var/log/nginx/atur-saku.error.log;
}
